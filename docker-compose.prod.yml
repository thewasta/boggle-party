# Production Docker Compose for Coolify deployment
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    image: boggle-party:latest
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - WS_HTTP_URL=http://websocket:3001
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
      - CORS_ORIGIN=${NEXT_PUBLIC_SITE_URL}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
    expose:
      - "3000"
    labels:
      - "coolify.managed=true"
      - "coolify.port=3000"
    depends_on:
      db:
        condition: service_healthy
      websocket:
        condition: service_healthy
    restart: unless-stopped

  websocket:
    build:
      context: ./websocket-server
      dockerfile: Dockerfile
    image: boggle-party-ws:latest
    environment:
      - NODE_ENV=production
      - PORT=3002
      - HTTP_PORT=3001
      - CORS_ORIGIN=${NEXT_PUBLIC_SITE_URL}
    expose:
      - "3001"
    labels:
      - "coolify.managed=true"
      - "coolify.port=3002"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:3001/health
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boggle_party}
      POSTGRES_USER: ${POSTGRES_USER:-boggle_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          -U ${POSTGRES_USER:-boggle_user}
          -d ${POSTGRES_DB:-boggle_party}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    shm_size: 128mb

volumes:
  postgres_data:
    driver: local
